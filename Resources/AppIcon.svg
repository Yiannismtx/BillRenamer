<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8edf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS squircle-ish rounded rect, ~82% of canvas -->
  <rect x="92" y="92" width="840" height="840" rx="188" fill="url(#bg)"/>

  <!-- document page with folded corner -->
  <g filter="url(#shadow)">
    <path d="M 332 232
             L 604 232
             L 712 340
             L 712 792
             Q 712 816 688 816
             L 356 816
             Q 332 816 332 792
             Z"
          fill="url(#page)"/>
    <path d="M 604 232 L 604 316 Q 604 340 628 340 L 712 340 Z" fill="#bcc8dc"/>
  </g>

  <!-- text lines: scrambled name -->
  <rect x="392" y="420" width="150" height="30" rx="15" fill="#c3cede"/>
  <rect x="558" y="420" width="70" height="30" rx="15" fill="#c3cede"/>
  <rect x="392" y="482" width="80" height="30" rx="15" fill="#c3cede"/>
  <rect x="488" y="482" width="140" height="30" rx="15" fill="#c3cede"/>

  <!-- rename arrow -->
  <path d="M 468 604 L 468 660 L 540 660" fill="none" stroke="#2563eb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 528 624 L 568 660 L 528 696 Z" fill="#2563eb"/>

  <!-- clean renamed line -->
  <rect x="392" y="716" width="236" height="34" rx="17" fill="#22c55e"/>
</svg>
